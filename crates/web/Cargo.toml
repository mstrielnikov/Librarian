[package]
name = "graphodoc_web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
graphodoc_core = { path = "../core" }

eframe = "0.27"
egui = "0.27"
ehttp = "0.5"  # <--- NEW: Simpler HTTP client for WASM
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
