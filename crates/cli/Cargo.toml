[package]
name = "graphodoc"
version = "0.1.0"
edition = "2024"

[dependencies]
graphodoc_core = { path = "../core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

lancedb = "0.22.3"

stop-words = "0.9.0"
rust-stemmers = "1.2.0"

# FIX: LanceDB "0.22.*" requires arrow crates match version "56.*"
arrow-array = "56"
arrow-schema = "56"
arrow-json = "56"

serde_json = "1.0.145"
serde = {version = "1.0.228", features = ["derive"]}

walkdir = "2.5"
pulldown-cmark = "0.13.0"
rayon = "1.10"
regex = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lazy_static = "1.5"
futures = "0.3.31"

